[package]
name = "gradengrs"
version = "0.1.0"
edition = "2024"

[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import gradengrs`). If you change this, you must also change the name of the
# `#[pymodule]` in `RModule/lib.rs`.
name = "gradengrs"
# "cdylib" is necessary to produce a shared library for Python to import from.
#
# Downstream Rust code (including code in `bin/`, `examples/`, and `tests/`) will not be able
# to `use gradengrs;` unless the "rlib" or "lib" crate type is also included, e.g.:
# crate-type = ["cdylib", "rlib"]
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
numpy = "0.29.0"

[profile.dev]
opt-level = 0